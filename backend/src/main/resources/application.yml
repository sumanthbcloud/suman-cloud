server:
  port: 8080

spring:
  application:
    name: suman-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:suman}
    username: ${POSTGRES_USER:suman}
    password: ${POSTGRES_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Application & AWS Configuration
app:
  jwt:
    secret: ${JWT_SECRET:suman-cloud-storage-super-secure-default-jwt-secret-key-32-chars}
    expiration-ms: 86400000 # 24 hours
  aws:
    region: ${AWS_REGION:us-east-1}
    s3-bucket: ${S3_BUCKET:suman-cloud-storage}
    ses-from-email: ${SES_FROM_EMAIL:noreply@suman.cloud}
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"
      - "http://localhost"
      - "http://127.0.0.1"
