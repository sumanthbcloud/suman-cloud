name: Reusable Docker CI

on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      working-directory:
        required: true
        type: string
      runtime:
        required: true
        type: string
      runtime-version:
        required: true
        type: string
      docker-context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      image-prefix:
        required: true
        type: string
    secrets:
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        if: inputs.runtime == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.runtime-version }}
          cache: 'maven'

      - name: Set up Node
        if: inputs.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.runtime-version }}
          cache: 'npm'
          cache-dependency-path: '${{ inputs.working-directory }}/package-lock.json'

      - name: Build frontend
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.working-directory }}
        run: |
          npm ci
          npm run build

      - name: Test backend
        if: inputs.runtime == 'java'
        working-directory: ${{ inputs.working-directory }}
        run: |
          chmod +x ./mvnw
          ./mvnw test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/suman-cloud:${{ inputs.image-prefix }}-${{ github.sha }}

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ vars.DOCKERHUB_USERNAME }}/suman-cloud:${{ inputs.image-prefix }}-${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/suman-cloud:${{ inputs.image-prefix }}-${{ github.sha }}
